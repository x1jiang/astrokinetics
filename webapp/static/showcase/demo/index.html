.bezels .bezel { display: block; position: absolute; inset: 0; width: 100%; height: 100%; z-index: 6; pointer-events: none; }
.bezels .xphone { --ph: min(690px, calc(100svh - 90px)); --pw: calc(var(--ph) * 1350 / 2760); width: var(--pw); height: var(--ph); padding: 0; background: none; box-shadow: none; border-radius: 0; display: block; }
.bezels .ph-screen { display: grid; grid-template-rows: auto 1fr auto; position: absolute; left: 5.4%; top: 2.5%; width: 89.3%; height: 95%; border-radius: calc(var(--pw) * 0.13); overflow: hidden; background: var(--bg); }
.bezels .ph-status { border-radius: 0; padding: 20px 26px 8px; }
.bezels .ph-tabs { border-radius: 0; padding-bottom: 22px; }
.bezels .xwatch { --ww: 250px; width: var(--ww); height: calc(var(--ww) * 940 / 620); font-size: 9.4px; padding: 0; background: none; box-shadow: none; border-radius: 0; }
.bezels .xwatch::before, .bezels .xwatch::after, .bezels .xw-crown { display: none; }

@media (max-width: 900px) {
  .bezels .xphone { --ph: min(100cqh, calc((100cqw - clamp(90px, 28cqw, 120px) - 10px) * 2760 / 1350), 690px); --pw: calc(var(--ph) * 1350 / 2760); }

  color-scheme: dark;
}
html.embed[data-host="light"], html.embed[data-host="light"][data-mode] {
  --bg: #ffffff; --surface: #f3f6fb; --ink: #0f172a; --muted: #52627a; --line: #e2e8f0;

}

}
html.embed body { background: transparent; font-size: 15px; }
html.embed .xp { background: transparent; animation: none; transition: none; gap: 20px;
  grid-template-columns: minmax(260px, 360px) 1fr; padding: 40px 28px 20px !important; }
html.embed .xp-close, html.embed .astra-demo-dock, html.embed .astra-grok-launcher { display: none !important; }

html.embed .coach-actions { gap: 8px; margin-top: 16px; }
html.embed .coach-actions > button { border-radius: .5rem; padding: .5rem .9rem; font: 600 .78rem/1.2 var(--sans); letter-spacing: 0;
  text-transform: none; border: 1px solid var(--ctl); background: var(--bg); color: var(--ink); box-shadow: none; transform: none;
  transition: background-color .14s ease, border-color .14s ease; }
html.embed .coach-actions > button:hover:not(:disabled) { background: var(--surface); border-color: var(--accent); transform: none; box-shadow: none; }

html.embed .coach-actions > .btn:hover:not(:disabled) { background: var(--accent); filter: brightness(1.07); }

<script>
/* Embed mode: follow the workstation's light / dark theme and load its typefaces. */
(function () {
  if (!/[?&]embed=1/.test(location.search)) return;
  var root = document.documentElement;
  root.classList.add('embed');
  var f = document.createElement('link'); f.rel = 'stylesheet';
  f.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap';
  document.head.appendChild(f);
  function sync() {
    var scheme = 'dark';
    try {
      var m = window.parent.document.querySelector('meta[name="color-scheme"]');
      scheme = (m && m.content) || 'dark';
    } catch (e) {}
    if (scheme !== 'light' && scheme !== 'dark') scheme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    root.setAttribute('data-host', scheme);
  }
  sync();
  try {
    var meta = window.parent.document.querySelector('meta[name="color-scheme"]');
    if (meta) new MutationObserver(sync).observe(meta, { attributes: true, attributeFilter: ['content'] });
  } catch (e) {}
})();
</script>

<script>
(function () {
  var xp = document.getElementById('xp');
  if (xp.hidden) document.getElementById('start').click();          // opened without #demo
  var embedded = document.documentElement.classList.contains('embed');
  new MutationObserver(function () {
    if (!xp.hidden) return;
    if (embedded) document.getElementById('start').click();         // inside the workstation tab there is nothing to go back to
    else location.replace('/?tab=demo');
  })
    .observe(xp, { attributes: true, attributeFilter: ['hidden'] }); // Close, Escape or the last button
})();
</script>
